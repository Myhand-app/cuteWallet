html[data-style=cool] .cgi{background:var(--chip);border-color:var(--chipb)}html[data-style=cool] .cgi.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card))}

html[data-style=default] .cgs{color:var(--ac)}html[data-style=default] .fab .sv{width:28px;height:28px}

html[data-style=stardew] .si,html[data-style=stardew] .ic,html[data-style=stardew] .cic{background:var(--chip);border:3px solid var(--chipb);border-radius:6px;box-shadow:inset 0 0 0 2px #ffffff55,1px 2px 0 #0004;color:#47260c}
html[data-style=stardew] #tb{background:var(--wood);border-bottom:4px solid var(--wood2);backdrop-filter:none;-webkit-backdrop-filter:none}

html[data-style=stardew] #tb .lg,html[data-style=stardew] .obl{background:var(--chip);border:3px solid var(--chipb);border-radius:6px;box-shadow:none}
html[data-style=stardew] #tb .ib{background:var(--chip);border:3px solid var(--chipb);border-radius:6px;color:#47260c}
html[data-style=stardew] .stick{background:var(--bg)}
html[data-style=stardew] nav{background:var(--wood);border-top:4px solid var(--wood2)}html[data-style=stardew] nav button{color:#f2d79a}html[data-style=stardew] nav .on{color:#fff}
html[data-style=stardew] nav button span{border-radius:6px}html[data-style=stardew] nav .on span{background:var(--chip);border:2px solid var(--chipb)}
html[data-style=stardew] .fab{background:var(--chip);border:3px solid var(--chipb);border-radius:8px;box-shadow:0 4px 0 #3d1f08}
html[data-style=stardew] #m>div{border:4px solid var(--wood2);border-bottom:0;border-radius:12px 12px 0 0}

html[data-style=stardew] .warn{border:2px solid var(--amb);border-radius:6px}

 it asks to press back once more within 2 s before leaving the app. */
function go(k){go0(k);hSync()}
var _ht=false,_hm=false,_hl=false,_hq=0,_skip=0,_lastBack=0;
