const cl=(x,y,q)=>`<circle cx="${x-q*.62}" cy="${y+q*.3}" r="${q*.7}" fill="url(#lg2)"/><circle cx="${x+q*.62}" cy="${y+q*.3}" r="${q*.7}" fill="url(#lg2)"/><circle cx="${x}" cy="${y-q*.15}" r="${q*.88}" fill="url(#lg1)"/><circle cx="${x-q*.3}" cy="${y-q*.45}" r="${q*.3}" fill="#fff" opacity=".14"/>`;

async function syncAll(){if(!sb||!SYNC.uid||SYNC.busy)return;if(!navigator.onLine){setStatus("offline");return}
SYNC.busy=true;setStatus("syncing");let refresh=false;
try{ST();const ux=SYNC.uid,own="sb_"+ux;IDX.upd=IDX.upd||{};
 /* payload = {meta:{cid:{upd,deleted}}, profiles:{cid:profileData}}; meta is fetched alone to keep checks cheap */
 const{data:mr,error:e1}=await sb.from(SB_TABLE).select("meta:payload->meta").eq("id",ux).maybeSingle();if(e1)throw e1;
 const meta=(mr&&mr.meta)||{};let full=null;
 const getFull=async()=>{if(full)return full;const{data,error}=await sb.from(SB_TABLE).select("payload").eq("id",ux).maybeSingle();if(error)throw error;full=(data&&data.payload)||{};full.meta=full.meta||{};full.profiles=full.profiles||{};return full};
 const L=new Map();IDX.list.forEach(id=>{const p=id===IDX.cur?S:loadP(id);if(p.cid)L.set(p.cid,id)});
 const need=[];
 for(const c in meta){const r=meta[c],id=L.get(c);
  if(r.deleted){if(id&&IDX.list.length>1&&(IDX.upd[id]||0)<=r.upd){if(id===IDX.cur)refresh=true;dropLocal(id)}continue}
  if(TOMB.has(c))continue;
  if(!id||r.upd>(IDX.upd[id]||0))need.push(c)}
 if(need.length){const f=await getFull();for(const c of need){const d=f.profiles[c];if(!d)continue;const id=L.get(c)||c;localStorage.setItem(KEY(id),JSON.stringify(d));if(!IDX.list.includes(id))IDX.list.push(id);IDX.upd[id]=meta[c].upd;LASTJ[id]=JSON.stringify(loadP(id));if(id===IDX.cur){S=loadP(id);refresh=true}}}
 const push=[];
 for(const id of IDX.list.slice()){const p=id===IDX.cur?S:loadP(id);if(!p.onb||(p.authUid&&p.authUid!==own))continue;
  if(!p.cid||!p.authUid){p.cid=p.cid||uid()+uid();p.authUid=own;if(id===IDX.cur)ST();else{localStorage.setItem(KEY(id),JSON.stringify(p));LASTJ[id]=JSON.stringify(loadP(id))}IDX.upd[id]=Date.now()}
  const r=meta[p.cid],lu=IDX.upd[id]||(IDX.upd[id]=Date.now());
  if(!r||lu>r.upd)push.push({c:p.cid,p,lu})}
 if(push.length||TOMB.size){const f=await getFull();
  for(const{c,p,lu}of push){f.profiles[c]=p;f.meta[c]={upd:lu,deleted:false}}
  for(const c of TOMB){delete f.profiles[c];f.meta[c]={upd:Date.now(),deleted:true}}
  const{error:e3}=await sb.from(SB_TABLE).upsert({id:ux,payload:f});if(e3)throw e3;TOMB.clear();saveTomb()}
 localStorage.setItem("mw_idx",JSON.stringify(IDX));SYNC.last=Date.now();setStatus("ok");if(refresh)applyAll()
}catch(e){setStatus("error",sbMsg(e))}finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;schedulePush(300)}}}
